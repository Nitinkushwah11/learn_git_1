server:
  port: 8087

spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:mysql://localhost:3306/alert_db?createDatabaseIfNotExist=true
    username: root
    password: Nitin@123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: placeholder@gmail.com
    password: placeholder_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
