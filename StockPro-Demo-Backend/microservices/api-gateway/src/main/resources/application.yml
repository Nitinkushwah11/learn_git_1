server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Route 1: Auth Service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            # Route 2: Product Service 
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**
              
            # Route 3: Warehouse Service 
            - id: warehouse-service
              uri: lb://warehouse-service
              predicates:
                - Path=/warehouse/**

            # Route 4: Supplier Service
            - id: supplier-service
              uri: lb://supplier-service
              predicates:
                - Path=/suppliers/**

            # Route 5: Movement Service
            - id: movement-service
              uri: lb://movement-service
              predicates:
                - Path=/movements/**

            # Route 6: Alert Service
            - id: alert-service
              uri: lb://alert-service
              predicates:
                - Path=/alerts/**

            # Route 7: Report Service
            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/reports/**

            # Route 8: Purchase Service
            - id: purchase-service
              uri: lb://purchase-service
              predicates:
                - Path=/purchase-orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/